<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bangkok Places</title><style>
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;margin:0;background:#f6f6f4;color:#111}
header{background:#fff;padding:10px 14px 4px}#cnw{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:6px 14px 4px;z-index:5}
h1{font-size:18px;margin:0 0 6px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
button{border:1px solid #bbb;background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}button.on{background:#111;color:#fff;border-color:#111}
main{max-width:760px;margin:0 auto;padding:10px 14px 40px}
details{background:#fff;border-radius:10px;margin:10px 0;padding:4px 12px;box-shadow:0 1px 2px #0001}summary{font-weight:700;font-size:16px;padding:10px 0;cursor:pointer}
.it{border-top:1px solid #eee;padding:14px 0}.nm{font-weight:700;font-size:15.5px}.ds{margin:5px 0 8px;color:#333;font-size:14px;line-height:1.5}.mt{font-size:12.5px;color:#555}
.b{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;margin-right:6px}.b0{background:#2e9d5b}.b1{background:#d99a1d}.b2{background:#d34b4b}
a.map{display:inline-block;margin-left:6px;color:#1a5fb4;text-decoration:none;font-weight:600}.note{font-size:12px;color:#666;margin:6px 0}
#cn{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}#cn button{white-space:nowrap;flex:0 0 auto;background:#f0efe9;border-color:#d6d4ca}details{scroll-margin-top:62px}</style></head><body><header><h1 id="ttl"></h1><div class="row" id="lg"></div><div class="row" id="fl"></div></header><div id="cnw"><div class="row" id="cn"></div></div><main><div class="note" id="nt"></div><div id="app"></div></main><script>
const DATA=[{"c":"sights","t":["1. Sights","1. Địa điểm tham quan"],"items":[{"n":"Yaowarat (Chinatown)","d":["Bangkok's Chinatown. Street food stalls open up in the evening (seafood, noodles, desserts), so go after dark.","Phố Tàu của Bangkok. Các quầy ẩm thực đường phố mở vào buổi tối (hải sản, mì, đồ ngọt), nên đi sau khi trời tối."],"km":8.7,"a":22,"b":40,"l":"https://maps.google.com/?q=Yaowarat+Chinatown+Bangkok","lv":2},{"n":"Wat Arun","d":["Temple of Dawn on the river with a tall central spire. Best around sunset, and you cross the river by a short ferry.","Chùa Bình Minh bên bờ sông với ngọn tháp cao ở giữa. Đẹp nhất lúc hoàng hôn, đi qua sông bằng phà ngắn."],"km":11.8,"a":29,"b":52,"l":"https://maps.google.com/?q=Wat+Arun+Bangkok","lv":2},{"n":"Grand Palace + Wat Pho","d":["Bangkok's top sights, close to each other. Go in the morning to avoid heat and crowds, and dress modestly (cover shoulders and knees).","Hai điểm tham quan nổi bật nhất Bangkok, nằm gần nhau. Nên đi buổi sáng để tránh nóng và đông người, ăn mặc kín đáo (che vai và đầu gối)."],"km":11.1,"a":27,"b":50,"l":"https://maps.google.com/?q=Grand+Palace+Bangkok","lv":2},{"n":"Jim Thompson House","d":["A traditional Thai house museum near Siam with the silk merchant's art collection. Quiet and shaded, easy to enjoy in an hour or two.","Bảo tàng nhà truyền thống Thái gần Siam, trưng bày bộ sưu tập nghệ thuật của ông vua lụa. Yên tĩnh, nhiều bóng mát, tham quan khoảng 1-2 giờ."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Jim+Thompson+House+Bangkok","lv":1},{"n":"Asiatique","d":["Riverside night market with shops, restaurants and a Ferris wheel, open in the evening. A good place to end the day by the water.","Chợ đêm ven sông với cửa hàng, nhà hàng và vòng quay khổng lồ, mở vào buổi tối. Thích hợp để kết thúc một ngày bên bờ sông."],"km":12.6,"a":30,"b":55,"l":"https://maps.google.com/?q=Asiatique+The+Riverfront","lv":2}]},{"c":"food","t":["2. Restaurants","2. Nhà hàng"],"items":[{"n":"Kwann","d":["Thai restaurant on Sukhumvit 13, one of the closest to the hotel. Reservations are available through Google Maps.","Nhà hàng Thái trên Sukhumvit 13, thuộc nhóm gần khách sạn nhất. Có thể đặt bàn qua Google Maps."],"km":2.7,"a":10,"b":16,"l":"https://maps.app.goo.gl/9Ri5u6t6vrMHHJPQ7","lv":0},{"n":"Jirakaan","d":["Thai restaurant on Sukhumvit 51 (Thonglor side). Online booking is available through Google Maps.","Nhà hàng Thái trên Sukhumvit 51 (khu Thonglor). Có thể đặt bàn online qua Google Maps."],"km":4.9,"a":15,"b":25,"l":"https://maps.app.goo.gl/e2aWFvGGVAeVgtVs8","lv":1},{"n":"Jim Thompson Thai Restaurant","d":["Thai restaurant of the Jim Thompson brand, near Siam (Kasem San 2). Booking is available through Google Maps.","Nhà hàng Thái của thương hiệu Jim Thompson, gần Siam (Kasem San 2). Có thể đặt bàn qua Google Maps."],"km":5.9,"a":17,"b":29,"l":"https://maps.app.goo.gl/wHrDv1M5qMZGvsfm7","lv":1},{"n":"Jim's Terrace at One Bangkok","d":["Asian fusion restaurant on the 1st floor of the new One Bangkok complex. Rated 4.9 on Google (355 reviews), about 400-600 THB per person.","Nhà hàng châu Á kết hợp ở tầng 1 khu phức hợp mới One Bangkok. Được 4,9 điểm trên Google (355 đánh giá), khoảng 400-600 THB mỗi người."],"km":6,"a":17,"b":29,"l":"https://maps.app.goo.gl/c1mxnC3FdyhjbNgo7","lv":1},{"n":"Benihana (Grand Mercure Atrium)","d":["Japanese teppanyaki restaurant in the Grand Mercure Bangkok Atrium hotel, where the chef cooks at your table. About 2 km from the hotel.","Nhà hàng Nhật teppanyaki trong khách sạn Grand Mercure Bangkok Atrium, đầu bếp nấu ngay tại bàn. Cách khách sạn khoảng 2 km."],"km":2.2,"a":9,"b":14,"l":"https://maps.google.com/?q=Benihana+Grand+Mercure+Bangkok+Atrium","lv":0},{"n":"Yankii Robatayaki & Bar","d":["Japanese charcoal grill (robatayaki) and bar on Sukhumvit 24 with a lively, trendy atmosphere.","Nhà hàng nướng than kiểu Nhật (robatayaki) và bar trên Sukhumvit 24, không khí sôi động, hợp xu hướng."],"km":4.8,"a":15,"b":24,"l":"https://maps.google.com/?q=Yankii+Robatayaki+Bangkok","lv":1},{"n":"Eat Me","d":["A date-night favorite in Silom since 1998, with dark, romantic rooms and a bamboo terrace. In the Michelin Guide. Open daily 5pm-1am; book online up to 45 days ahead.","Nhà hàng hẹn hò được yêu thích ở Silom từ năm 1998, phòng ăn tối lãng mạn và sân thượng tre. Có trong Michelin Guide. Mở cửa 17h-1h hằng ngày; đặt online trước tối đa 45 ngày."],"km":7.2,"a":19,"b":34,"l":"https://maps.google.com/?q=Eat+Me+Restaurant+Bangkok","lv":1},{"n":"Sri Trat","d":["Eastern Thai cooking near Phrom Phong (Sukhumvit 33). Michelin Bib Gourmand, about 500-800 THB per person. Fills up every evening, so book ahead.","Món Thái miền Đông gần Phrom Phong (Sukhumvit 33). Michelin Bib Gourmand, khoảng 500-800 THB mỗi người. Tối nào cũng đông, nên đặt trước."],"km":3.7,"a":12,"b":20,"l":"https://maps.google.com/?q=Sri+Trat+Sukhumvit+33+Bangkok","lv":0},{"n":"Bisou","d":["Modern French restaurant hidden on Soi Langsuan, with dishes made for sharing. Listed in the Michelin Guide Thailand 2026.","Nhà hàng Pháp hiện đại ẩn mình ở Soi Langsuan, món ăn dành để chia sẻ. Có trong Michelin Guide Thailand 2026."],"km":5.1,"a":15,"b":25,"l":"https://maps.google.com/?q=Bisou+Bangkok+Langsuan","lv":1},{"n":"Jay Fai","d":["Famous Old City street-food restaurant with a Michelin star, known for its crab omelette. Open Wednesday to Saturday only, and there is usually a queue.","Quán ăn đường phố nổi tiếng ở khu phố cổ, có sao Michelin, nổi tiếng với món trứng chiên cua. Chỉ mở thứ 4 đến thứ 7 và thường phải xếp hàng."],"km":9.2,"a":23,"b":42,"l":"https://maps.google.com/?q=Raan+Jay+Fai+Bangkok","lv":2},{"n":"El Santo","d":["Mexican restaurant and bar on Sukhumvit 29 with a lucha libre (Mexican wrestling) theme. Try the quesabirria tacos and a margarita. Open noon to midnight.","Nhà hàng và bar Mexico trên Sukhumvit 29, chủ đề đấu vật lucha libre. Nên thử taco quesabirria và margarita. Mở cửa 12h đến nửa đêm."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=El+Santo+Mexican+Sukhumvit+29+Bangkok","lv":0},{"n":"Santiaga","d":["Named Best Mexican Restaurant 2026 by BK Magazine Top Tables. Handmade tortillas, tacos, and mezcal cocktails.","Được BK Magazine Top Tables bình chọn là nhà hàng Mexico tốt nhất 2026. Bánh tortilla làm thủ công, taco và cocktail mezcal."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=Santiaga+Mexican+Bangkok","lv":0},{"n":"Bokkia Tha Din Daeng","d":["Local Thai restaurant in Din Daeng, listed in the Michelin Guide. Farther from the hotel than other local spots; menu and hours not checked yet.","Quán Thái bình dân ở Din Daeng, có trong Michelin Guide. Xa khách sạn hơn các quán địa phương khác; chưa kiểm tra thực đơn và giờ mở cửa."],"km":10.3,"a":26,"b":46,"l":"https://maps.google.com/?q=Bokkia+Tha+Din+Daeng+Bangkok","lv":2},{"n":"Rung Rueng Pork Noodles","d":["Michelin Bib Gourmand pork noodle shop on Sukhumvit 26. Try the tom yum pork noodles. Cash only, open daily 8am-5pm.","Quán mì heo Michelin Bib Gourmand trên Sukhumvit 26. Nên thử mì heo tom yum. Chỉ nhận tiền mặt, mở cửa 8h-17h hằng ngày."],"km":5,"a":15,"b":25,"l":"https://maps.google.com/?q=Rung+Rueng+Pork+Noodles+Sukhumvit+26","lv":1}]},{"c":"cruise","t":["3. Cruise","3. Du thuyền"],"items":[{"n":"Opulence","d":["Dinner cruise on the Chao Phraya River with a trendy, refined style. Price and booking details are not checked yet.","Du thuyền ăn tối trên sông Chao Phraya, phong cách hiện đại và tinh tế. Chưa kiểm tra giá và cách đặt chỗ."],"km":9.6,"a":24,"b":43,"l":"https://maps.google.com/?q=Opulence+Cruise+Bangkok","lv":2},{"n":"Chao Phraya Princess","d":["Buffet dinner cruise, 19:30-21:30, leaving from ICONSIAM Pier by default. Official site shows 1,200-1,900 THB per person. Non-refundable, same-day booking until 4pm. Booking needed for 2 people.","Du thuyền ăn tối buffet, 19:30-21:30, mặc định khởi hành từ bến ICONSIAM. Trang chính thức ghi 1.200-1.900 THB mỗi người. Không hoàn tiền, đặt trong ngày đến 16h. Cần đặt chỗ cho 2 người."],"km":9.6,"a":24,"b":43,"l":"https://maps.google.com/?q=Chao+Phraya+Princess+Cruise+ICONSIAM+Pier+Bangkok","lv":2}]},{"c":"roof","t":["4. Rooftop bars","4. Quán bar sân thượng"],"items":[{"n":"Sanctuary","d":["Jungle-like rooftop of bamboo, rattan and plants on the 34th floor of InterContinental Bangkok Sukhumvit. Opened March 2025. Reservations recommended; open 5pm-midnight.","Sân thượng phong cách rừng nhiệt đới với tre, mây và cây xanh ở tầng 34 InterContinental Bangkok Sukhumvit. Khai trương tháng 3/2025. Nên đặt chỗ; mở cửa 17h-0h."],"km":6.2,"a":17,"b":30,"l":"https://maps.google.com/?q=Sanctuary+Bangkok+InterContinental","lv":1},{"n":"Above Eleven","d":["Peruvian-Japanese rooftop restaurant and bar on Sukhumvit 11 with a good kitchen and a lively scene. The closest rooftop to the hotel.","Nhà hàng và bar sân thượng Peru-Nhật trên Sukhumvit 11, đồ ăn ngon và không khí sôi động. Là sân thượng gần khách sạn nhất."],"km":2.8,"a":11,"b":16,"l":"https://maps.google.com/?q=Above+Eleven+Bangkok","lv":0},{"n":"Char (Hotel Indigo)","d":["Rooftop at Hotel Indigo on Wireless Road. Hipper and less corporate than most, with good craft cocktails.","Sân thượng tại Hotel Indigo trên đường Wireless. Trẻ trung, ít khuôn mẫu hơn, cocktail thủ công ngon."],"km":4.3,"a":14,"b":22,"l":"https://maps.google.com/?q=Char+Rooftop+Hotel+Indigo+Bangkok","lv":1},{"n":"WALK Rooftop","d":["Rooftop bar on the 20th floor of Centara Watergate Pavilion in Pratunam. Sophisticated yet affordable.","Bar sân thượng ở tầng 20 Centara Watergate Pavilion, khu Pratunam. Tinh tế nhưng giá hợp lý."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=WALK+Rooftop+Centara+Watergate","lv":0},{"n":"Lamaya","d":["Jungle / tribal-themed sky bar on the 30th floor above Sukhumvit 24. Opened December 2024. Cocktails about 380-420 THB, with DJs and weekend fire shows.","Sky bar phong cách rừng/bộ lạc ở tầng 30 trên Sukhumvit 24. Khai trương tháng 12/2024. Cocktail khoảng 380-420 THB, có DJ và biểu diễn lửa cuối tuần."],"km":5.4,"a":16,"b":27,"l":"https://maps.google.com/?q=Lamaya+Bangkok","lv":1},{"n":"Tichuca","d":["Famous for its giant LED \"Avatar tree\" that changes color through the night (46th floor, T-One Building). Walk-in only, bring your passport, 17% service charge.","Nổi tiếng với \"cây Avatar\" LED khổng lồ đổi màu suốt đêm (tầng 46, tòa T-One). Chỉ nhận khách vãng lai, mang theo hộ chiếu, phụ thu phục vụ 17%."],"km":6.2,"a":17,"b":30,"l":"https://maps.google.com/?q=Tichuca+Rooftop+Bar","lv":1},{"n":"Octave (Marriott)","d":["Three-level rooftop on floors 45-49 of Bangkok Marriott Sukhumvit (Thonglor), with 360-degree views. Cocktails about 350-450 THB; happy hour around 5-7pm.","Sân thượng 3 tầng ở tầng 45-49 Bangkok Marriott Sukhumvit (Thonglor), tầm nhìn 360 độ. Cocktail khoảng 350-450 THB; giờ vàng khoảng 17h-19h."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Octave+Rooftop+Bangkok","lv":1}]},{"c":"wine","t":["5. Wine bars / pubs","5. Quán rượu vang / pub"],"items":[{"n":"Chenin","d":["Intimate, candlelit natural wine bar and bistro on Sukhumvit 31, with 100+ labels. Good for a date. The closest of the wine bars.","Quán rượu vang tự nhiên và bistro ấm cúng, ánh nến, trên Sukhumvit 31, hơn 100 loại rượu. Hợp để hẹn hò. Gần nhất trong các quán rượu vang."],"km":3.5,"a":12,"b":19,"l":"https://maps.google.com/?q=Chenin+Bangkok+Sukhumvit+31","lv":0},{"n":"Vessel (EmSphere)","d":["Wine bar on the ground floor of EmSphere, right beside Phrom Phong BTS, with more than 200 wines by the glass.","Quán rượu vang ở tầng trệt EmSphere, ngay cạnh BTS Phrom Phong, hơn 200 loại rượu vang bán theo ly."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=Vessel+Wine+Bar+EmSphere+Bangkok","lv":1},{"n":"1010 Wine Bar & Restaurant","d":["Wine bar and restaurant on the 5th floor of EmSphere, with Italian-Mediterranean food and about 60 wines by the glass or bottle.","Quán rượu vang và nhà hàng ở tầng 5 EmSphere, món Ý-Địa Trung Hải, khoảng 60 loại rượu vang bán theo ly hoặc chai."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=1010+Wine+Bar+Emsphere+Bangkok","lv":1},{"n":"Swirl (Thonglor)","d":["New wine bar at Civic Park, Thong Lo 13, picked by Time Out as one of Bangkok's top new wine bars. Open daily 2:30pm-11pm.","Quán rượu vang mới ở Civic Park, Thong Lo 13, được Time Out chọn là một trong những quán rượu vang mới hàng đầu Bangkok. Mở cửa 14h30-23h hằng ngày."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=Swirl+Thonglor+Bangkok","lv":1},{"n":"Piché Wine Bar","d":["Thailand's first wine-on-tap bar, at BLV24 on Sukhumvit 24. Opened May 2025, with DJs and a music-driven atmosphere.","Quán rượu vang rót từ vòi đầu tiên của Thái Lan, tại BLV24 trên Sukhumvit 24. Khai trương tháng 5/2025, có DJ và không khí âm nhạc sôi động."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Piche+Wine+Bar+Bangkok","lv":1}]},{"c":"club","t":["6. Club lounges","6. Club / lounge"],"items":[{"n":"Havana Social","d":["Hidden bar behind a phone booth, inspired by 1940s Cuba, on Sukhumvit Soi 11. Latin music from 10pm, smart casual (covered shoes for men), 20+ only. Open 6pm-2am.","Bar bí mật sau buồng điện thoại, lấy cảm hứng từ Cuba thập niên 1940, trên Sukhumvit Soi 11. Nhạc Latin từ 22h, ăn mặc lịch sự (nam đi giày kín), chỉ từ 20 tuổi. Mở cửa 18h-2h."],"km":2.9,"a":11,"b":16,"l":"https://maps.google.com/?q=Havana+Social+Bangkok","lv":0},{"n":"Upper House","d":["Club on the 2nd floor of 24 BLVD, Sukhumvit 24, near Phrom Phong. R&B and hip-hop early, house and EDM late. Table minimum about 10,000-25,000 THB.","Club ở tầng 2 tòa 24 BLVD, Sukhumvit 24, gần Phrom Phong. Đầu đêm R&B và hip-hop, về khuya house và EDM. Đặt bàn tối thiểu khoảng 10.000-25.000 THB."],"km":6,"a":17,"b":29,"l":"https://maps.app.goo.gl/iMwkYuAkp7StQyX66","lv":1},{"n":"Salone Di Vita","d":["Luxury hip-hop and R&B club on Sukhumvit 63 (Ekkamai) with baroque decor and international guest DJs. Open from 9pm; entry about 1,000 THB or more.","Club hip-hop và R&B sang trọng trên Sukhumvit 63 (Ekkamai), nội thất kiểu baroque, có DJ khách quốc tế. Mở cửa từ 21h; vé vào khoảng 1.000 THB trở lên."],"km":5.2,"a":15,"b":26,"l":"https://maps.app.goo.gl/YwF53TcwopQPaGsQA","lv":1},{"n":"Dope & Dirty","d":["Hip-hop club on Sukhumvit 63 (Ekkamai 7) with graffiti and neon, popular with young locals. Reservation recommended, smart casual.","Club hip-hop trên Sukhumvit 63 (Ekkamai 7), tường graffiti và đèn neon, được giới trẻ địa phương yêu thích. Nên đặt trước, ăn mặc lịch sự."],"km":5.2,"a":15,"b":26,"l":"https://maps.app.goo.gl/TwXEKjZy3HjfxBKt6","lv":1}]}];
const UI={en:{t:'Bangkok Places',lv:['Near','Medium','Far'],all:'All',nt:'Taxi distance from the hotel (Somerset Rama 9). Estimated from map coordinates; real time depends on traffic.',map:'Map',min:'min'},vi:{t:'Địa điểm ở Bangkok',lv:['Gần','Trung bình','Xa'],all:'Tất cả',nt:'Khoảng cách taxi từ khách sạn (Somerset Rama 9). Ước tính theo tọa độ bản đồ; thời gian thực tế tùy giao thông.',map:'Bản đồ',min:'phút'}};
const LI={en:0,vi:1};let CL='en',CF=-1;function goTo(k){const d=document.getElementById('c-'+k);if(!d)return;d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}function setL(x){CL=x;render()}function setF(v){CF=v;render()}
function render(){const u=UI[CL];ttl.textContent=u.t;nt.textContent=u.nt;
lg.innerHTML=['en','vi'].map(x=>'<button class="'+(x===CL?'on':'')+'" onclick="setL(\''+x+'\')">'+{en:'English',vi:'Tiếng Việt'}[x]+'</button>').join('');
fl.innerHTML=['all',0,1,2].map(v=>{const val=v==='all'?-1:v;return '<button class="'+(CF===val?'on':'')+'" onclick="setF('+val+')">'+(v==='all'?u.all:u.lv[v])+'</button>'}).join('');
cn.innerHTML=DATA.filter(c=>c.items.some(i=>CF<0||i.lv===CF)).map(c=>'<button onclick="goTo(\''+c.c+'\')">'+c.t[LI[CL]].replace(/^\d+\.\s*/,'')+'</button>').join('');app.innerHTML=DATA.map(c=>{const its=c.items.filter(i=>CF<0||i.lv===CF);if(!its.length)return '';return '<details open id="c-'+c.c+'"><summary>'+c.t[LI[CL]]+' ('+its.length+')</summary>'+its.map((i,x)=>'<div class="it"><div class="nm">'+(x+1)+'. '+i.n+'</div><div class="ds">'+i.d[LI[CL]]+'</div><div class="mt"><span class="b b'+i.lv+'">'+u.lv[i.lv]+'</span>~'+i.km+' km, taxi ~'+i.a+'-'+i.b+' '+u.min+'<a class="map" href="'+i.l+'" target="_blank">'+u.map+' &rarr;</a></div></div>').join('')+'</details>'}).join('')}
render();</script></body></html>
