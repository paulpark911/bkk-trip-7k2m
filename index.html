const DATA=[{"c":"sights","t":["1. Sights","1. Địa điểm tham quan","1. 관광지"],"items":[{"n":"Yaowarat (Chinatown)","d":["Bangkok's Chinatown. Street food stalls open up in the evening (seafood, noodles, desserts), so go after dark.","Phố Tàu của Bangkok. Các quầy ẩm thực đường phố mở vào buổi tối (hải sản, mì, đồ ngọt), nên đi sau khi trời tối.","방콕 차이나타운. 저녁에 해산물, 국수, 디저트 등 길거리 음식 노점이 열리니 해가 진 뒤에 가세요."],"km":8.7,"a":22,"b":40,"l":"https://maps.google.com/?q=Yaowarat+Chinatown+Bangkok","lv":2},{"n":"Wat Arun","d":["Temple of Dawn on the river with a tall central spire. Best around sunset, and you cross the river by a short ferry.","Chùa Bình Minh bên bờ sông với ngọn tháp cao ở giữa. Đẹp nhất lúc hoàng hôn, đi qua sông bằng phà ngắn.","강가에 있는 새벽 사원으로 가운데 높은 탑이 인상적이에요. 해질 무렵이 가장 예쁘고, 짧은 페리로 강을 건너가요."],"km":11.8,"a":29,"b":52,"l":"https://maps.google.com/?q=Wat+Arun+Bangkok","lv":2,"g":"4.7","rc":"45,511"},{"n":"Grand Palace + Wat Pho","d":["Bangkok's top sights, close to each other. Go in the morning to avoid heat and crowds, and dress modestly (cover shoulders and knees).","Hai điểm tham quan nổi bật nhất Bangkok, nằm gần nhau. Nên đi buổi sáng để tránh nóng và đông người, ăn mặc kín đáo (che vai và đầu gối).","방콕 최고의 명소 두 곳으로 서로 가까워요. 더위와 인파를 피하려면 오전에 가고, 어깨와 무릎을 가리는 단정한 복장이 필요해요."],"km":11.1,"a":27,"b":50,"l":"https://maps.google.com/?q=Grand+Palace+Bangkok","lv":2,"g":"4.6","rc":"80,772","ig":"grandpalacebangkok.official"},{"n":"Jim Thompson House","d":["A traditional Thai house museum near Siam with the silk merchant's art collection. Quiet and shaded, easy to enjoy in an hour or two.","Bảo tàng nhà truyền thống Thái gần Siam, trưng bày bộ sưu tập nghệ thuật của ông vua lụa. Yên tĩnh, nhiều bóng mát, tham quan khoảng 1-2 giờ.","시암 근처의 전통 태국 가옥 박물관으로, 실크 사업가의 미술 컬렉션이 있어요. 조용하고 그늘이 많아 1~2시간 둘러보기 좋아요."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Jim+Thompson+House+Bangkok","lv":1,"g":"4.5","rc":"17,670","ig":"jimthompsonhousemuseum"},{"n":"Asiatique","d":["Riverside night market with shops, restaurants and a Ferris wheel, open in the evening. A good place to end the day by the water.","Chợ đêm ven sông với cửa hàng, nhà hàng và vòng quay khổng lồ, mở vào buổi tối. Thích hợp để kết thúc một ngày bên bờ sông.","쇼핑, 레스토랑, 대관람차가 있는 강변 야시장으로 저녁에 열어요. 물가에서 하루를 마무리하기 좋아요."],"km":12.6,"a":30,"b":55,"l":"https://maps.google.com/?q=Asiatique+The+Riverfront","lv":2,"g":"4.4","rc":"76,579","ig":"asiatique.thailand"}]},{"c":"food","t":["2. Restaurants","2. Nhà hàng","2. 레스토랑"],"items":[{"n":"Kwann","d":["Thai restaurant on Sukhumvit 13, one of the closest to the hotel. Reservations are available through Google Maps.","Nhà hàng Thái trên Sukhumvit 13, thuộc nhóm gần khách sạn nhất. Có thể đặt bàn qua Google Maps.","수쿰윗 13에 있는 태국 레스토랑으로 호텔에서 가장 가까운 곳 중 하나예요. 구글 지도에서 예약할 수 있어요."],"km":2.7,"a":10,"b":16,"l":"https://maps.app.goo.gl/9Ri5u6t6vrMHHJPQ7","lv":0,"g":"4.7","rc":"301","ig":"kwannrestaurant"},{"n":"Jirakaan","d":["Thai restaurant on Sukhumvit 51 (Thonglor side). Online booking is available through Google Maps.","Nhà hàng Thái trên Sukhumvit 51 (khu Thonglor). Có thể đặt bàn online qua Google Maps.","수쿰윗 51(통로 쪽)의 태국 레스토랑이에요. 구글 지도에서 온라인 예약이 가능해요."],"km":4.9,"a":15,"b":25,"l":"https://maps.app.goo.gl/e2aWFvGGVAeVgtVs8","lv":1,"g":"4.9","rc":"1,514","ig":"jirakaan_restaurant"},{"n":"Jim Thompson Thai Restaurant","d":["Thai restaurant of the Jim Thompson brand, near Siam (Kasem San 2). Booking is available through Google Maps.","Nhà hàng Thái của thương hiệu Jim Thompson, gần Siam (Kasem San 2). Có thể đặt bàn qua Google Maps.","짐 톰슨 브랜드의 태국 레스토랑으로 시암 근처(Kasem San 2)에 있어요. 구글 지도에서 예약할 수 있어요."],"km":5.9,"a":17,"b":29,"l":"https://maps.app.goo.gl/wHrDv1M5qMZGvsfm7","lv":1,"g":"4.8","rc":"4,567","ig":"jimthompsonathairestaurant"},{"n":"Jim's Terrace at One Bangkok","d":["Asian fusion restaurant on the 1st floor of the new One Bangkok complex. Rated 4.9 on Google (355 reviews), about 400-600 THB per person.","Nhà hàng châu Á kết hợp ở tầng 1 khu phức hợp mới One Bangkok. Được 4,9 điểm trên Google (355 đánh giá), khoảng 400-600 THB mỗi người.","새로 생긴 원 방콕(One Bangkok) 단지 1층의 아시안 퓨전 레스토랑이에요. 구글 평점 4.9(리뷰 355개), 1인 약 400~600바트예요."],"km":6,"a":17,"b":29,"l":"https://maps.app.goo.gl/c1mxnC3FdyhjbNgo7","lv":1,"g":"4.9","rc":"355","ig":"jimsterrace"},{"n":"Benihana (Grand Mercure Atrium)","d":["Japanese teppanyaki restaurant in the Grand Mercure Bangkok Atrium hotel, where the chef cooks at your table. About 2 km from the hotel.","Nhà hàng Nhật teppanyaki trong khách sạn Grand Mercure Bangkok Atrium, đầu bếp nấu ngay tại bàn. Cách khách sạn khoảng 2 km.","그랜드 머큐어 방콕 아트리움 호텔 안의 일식 철판요리 식당으로, 셰프가 테이블 앞에서 요리해줘요. 호텔에서 약 2km예요."],"km":2.2,"a":9,"b":14,"l":"https://maps.google.com/?q=Benihana+Grand+Mercure+Bangkok+Atrium","lv":0,"g":"4.9","rc":"3,009","ig":"benihana_atrium"},{"n":"Yankii Robatayaki & Bar","d":["Japanese charcoal grill (robatayaki) and bar on Sukhumvit 24 with a lively, trendy atmosphere.","Nhà hàng nướng than kiểu Nhật (robatayaki) và bar trên Sukhumvit 24, không khí sôi động, hợp xu hướng.","수쿰윗 24에 있는 일본식 숯불구이(로바타야키) 바로, 활기차고 트렌디한 분위기예요."],"km":4.8,"a":15,"b":24,"l":"https://maps.google.com/?q=Yankii+Robatayaki+Bangkok","lv":1,"g":"4.8","rc":"1,088","ig":"yankii_bkk"},{"n":"Eat Me","d":["A date-night favorite in Silom since 1998, with dark, romantic rooms and a bamboo terrace. In the Michelin Guide. Open daily 5pm-1am; book online up to 45 days ahead.","Nhà hàng hẹn hò được yêu thích ở Silom từ năm 1998, phòng ăn tối lãng mạn và sân thượng tre. Có trong Michelin Guide. Mở cửa 17h-1h hằng ngày; đặt online trước tối đa 45 ngày.","1998년부터 실롬에서 데이트 장소로 사랑받아 온 곳으로, 어둡고 로맨틱한 실내와 대나무 테라스가 있어요. 미쉐린 가이드에 올라 있고, 매일 17시~새벽 1시 영업, 최대 45일 전까지 온라인 예약이 가능해요."],"km":7.2,"a":19,"b":34,"l":"https://maps.google.com/?q=Eat+Me+Restaurant+Bangkok","lv":1,"g":"4.6","rc":"1,773","ig":"eatmerestaurant"},{"n":"Sri Trat","d":["Eastern Thai cooking near Phrom Phong (Sukhumvit 33). Michelin Bib Gourmand, about 500-800 THB per person. Fills up every evening, so book ahead.","Món Thái miền Đông gần Phrom Phong (Sukhumvit 33). Michelin Bib Gourmand, khoảng 500-800 THB mỗi người. Tối nào cũng đông, nên đặt trước.","프롬퐁 근처(수쿰윗 33)의 태국 동부식 요리집이에요. 미쉐린 빕 구르망, 1인 약 500~800바트이고, 매일 저녁 붐비니 미리 예약하세요."],"km":3.7,"a":12,"b":20,"l":"https://maps.google.com/?q=Sri+Trat+Sukhumvit+33+Bangkok","lv":0,"g":"4.5","rc":"2,690","ig":"sritrat"},{"n":"Bisou","d":["Modern French restaurant hidden on Soi Langsuan, with dishes made for sharing. Listed in the Michelin Guide Thailand 2026.","Nhà hàng Pháp hiện đại ẩn mình ở Soi Langsuan, món ăn dành để chia sẻ. Có trong Michelin Guide Thailand 2026.","랑수안 골목에 숨어 있는 모던 프렌치 레스토랑으로, 나눠 먹는 요리가 중심이에요. 미쉐린 가이드 태국 2026에 올라 있어요."],"km":5.1,"a":15,"b":25,"l":"https://maps.google.com/?q=Bisou+Bangkok+Langsuan","lv":1,"g":"4.9","rc":"3,371","ig":"bisoubangkok"},{"n":"Jay Fai","d":["Famous Old City street-food restaurant with a Michelin star, known for its crab omelette. Open Wednesday to Saturday only, and there is usually a queue.","Quán ăn đường phố nổi tiếng ở khu phố cổ, có sao Michelin, nổi tiếng với món trứng chiên cua. Chỉ mở thứ 4 đến thứ 7 và thường phải xếp hàng.","올드시티의 유명한 길거리 음식 식당으로 미쉐린 별 1개를 받았고, 게살 오믈렛으로 유명해요. 수~토요일만 열고 보통 줄이 길어요."],"km":9.2,"a":23,"b":42,"l":"https://maps.google.com/?q=Raan+Jay+Fai+Bangkok","lv":2,"g":"3.6","rc":"5,121","ig":"jayfaibangkok"},{"n":"El Santo","d":["Mexican restaurant and bar on Sukhumvit 29 with a lucha libre (Mexican wrestling) theme. Try the quesabirria tacos and a margarita. Open noon to midnight.","Nhà hàng và bar Mexico trên Sukhumvit 29, chủ đề đấu vật lucha libre. Nên thử taco quesabirria và margarita. Mở cửa 12h đến nửa đêm.","수쿰윗 29에 있는 멕시칸 레스토랑 겸 바로, 루차 리브레(멕시코 프로레슬링) 콘셉트예요. 퀘사비리아 타코와 마가리타를 드셔보세요. 낮 12시~자정 영업이에요."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=El+Santo+Mexican+Sukhumvit+29+Bangkok","lv":0,"g":"4.7","rc":"1,115","ig":"elsantobkk"},{"n":"Santiaga","d":["Named Best Mexican Restaurant 2026 by BK Magazine Top Tables. Handmade tortillas, tacos, and mezcal cocktails.","Được BK Magazine Top Tables bình chọn là nhà hàng Mexico tốt nhất 2026. Bánh tortilla làm thủ công, taco và cocktail mezcal.","BK Magazine Top Tables 2026에서 최고의 멕시칸 레스토랑으로 뽑혔어요. 수제 토르티야, 타코, 메즈칼 칵테일이 있어요."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=Santiaga+Mexican+Bangkok","lv":0,"g":"4.8","rc":"142","ig":"santiagabkk"},{"n":"Bokkia Tha Din Daeng","d":["Local Thai restaurant in Din Daeng, listed in the Michelin Guide. Farther from the hotel than other local spots; menu and hours not checked yet.","Quán Thái bình dân ở Din Daeng, có trong Michelin Guide. Xa khách sạn hơn các quán địa phương khác; chưa kiểm tra thực đơn và giờ mở cửa.","딘댕에 있는 현지 태국 식당으로 미쉐린 가이드에 올라 있어요. 다른 현지 맛집보다 호텔에서 멀고, 메뉴와 영업시간은 아직 확인하지 않았어요."],"km":10.3,"a":26,"b":46,"l":"https://maps.google.com/?q=Bokkia+Tha+Din+Daeng+Bangkok","lv":2,"g":"4.5","rc":"580"},{"n":"Rung Rueng Pork Noodles","d":["Michelin Bib Gourmand pork noodle shop on Sukhumvit 26. Try the tom yum pork noodles. Cash only, open daily 8am-5pm.","Quán mì heo Michelin Bib Gourmand trên Sukhumvit 26. Nên thử mì heo tom yum. Chỉ nhận tiền mặt, mở cửa 8h-17h hằng ngày.","수쿰윗 26에 있는 미쉐린 빕 구르망 돼지고기 국수집이에요. 똠얌 돼지고기 국수를 드셔보세요. 현금만 가능하고 매일 8시~17시 영업이에요."],"km":5,"a":15,"b":25,"l":"https://maps.google.com/?q=Rung+Rueng+Pork+Noodles+Sukhumvit+26","lv":1,"g":"4.4","rc":"9,486"},{"n":"Sakkwa","d":["Thai restaurant on the 4th floor in Talat Noi (Charoen Krung), serving mainly a la carte, with walk-ins welcome. Known for duck, Kaffir Lime and pineapple soft serve. Opens 5pm. Saved from your shared Google Maps link.","Nhà hàng Thái ở tầng 4 tại Talat Noi (Charoen Krung), chủ yếu gọi món à la carte, chào đón khách không đặt trước. Nổi tiếng với món vịt, Kaffir Lime và kem mềm dứa. Mở cửa lúc 17h. Lưu từ liên kết Google Maps bạn gửi.","탈랏노이(Charoen Krung) 건물 4층의 태국 레스토랑으로, 주로 단품(알라카르트) 메뉴이고 예약 없이도 갈 수 있어요. 오리 요리, 카피르 라임, 파인애플 소프트아이스크림이 유명해요. 17시에 열어요. 보내주신 구글맵 링크에서 추가했어요."],"km":8.7,"a":22,"b":38,"l":"https://maps.app.goo.gl/wBostoUPbNFLFqfG9","lv":2,"g":"5.0","rc":"453"}]},{"c":"cruise","t":["3. Cruise","3. Du thuyền","3. 크루즈"],"items":[{"n":"Opulence","d":["Dinner cruise on the Chao Phraya River with a trendy, refined style. Price and booking details are not checked yet.","Du thuyền ăn tối trên sông Chao Phraya, phong cách hiện đại và tinh tế. Chưa kiểm tra giá và cách đặt chỗ.","짜오프라야강에서 즐기는 디너 크루즈로 세련되고 트렌디한 스타일이에요. 가격과 예약 정보는 아직 확인하지 않았어요."],"km":9.6,"a":24,"b":43,"l":"https://maps.google.com/?q=Opulence+Cruise+Bangkok","lv":2,"g":"4.5","rc":"333","ig":"theopulencecruise"},{"n":"Chao Phraya Princess","d":["Buffet dinner cruise, 19:30-21:30, leaving from ICONSIAM Pier by default. Official site shows 1,200-1,900 THB per person. Non-refundable, same-day booking until 4pm. Booking needed for 2 people.","Du thuyền ăn tối buffet, 19:30-21:30, mặc định khởi hành từ bến ICONSIAM. Trang chính thức ghi 1.200-1.900 THB mỗi người. Không hoàn tiền, đặt trong ngày đến 16h. Cần đặt chỗ cho 2 người.","19:30~21:30 뷔페 디너 크루즈로, 기본 출발지는 아이콘시암 선착장이에요. 공식 사이트 기준 1인 1,200~1,900바트예요. 환불 불가, 당일 예약은 16시까지이고 2인 예약이 필요해요."],"km":9.6,"a":24,"b":43,"l":"https://maps.google.com/?q=Chao+Phraya+Princess+Cruise+ICONSIAM+Pier+Bangkok","lv":2,"g":"4.4","rc":"5,077","ig":"chaophrayaprincess_official"}]},{"c":"roof","t":["4. Rooftop bars","4. Quán bar sân thượng","4. 루프탑 바"],"items":[{"n":"Sanctuary","d":["Jungle-like rooftop of bamboo, rattan and plants on the 34th floor of InterContinental Bangkok Sukhumvit. Opened March 2025. Reservations recommended; open 5pm-midnight.","Sân thượng phong cách rừng nhiệt đới với tre, mây và cây xanh ở tầng 34 InterContinental Bangkok Sukhumvit. Khai trương tháng 3/2025. Nên đặt chỗ; mở cửa 17h-0h.","인터컨티넨탈 방콕 수쿰윗 34층에 있는 정글 느낌의 루프탑으로 대나무, 라탄, 식물로 꾸며져 있어요. 2025년 3월 오픈, 예약을 권장하며 17시~자정 영업이에요."],"km":6.2,"a":17,"b":30,"l":"https://maps.google.com/?q=Sanctuary+Bangkok+InterContinental","lv":1,"g":"4.6","rc":"586","ig":"sanctuarybangkok"},{"n":"Above Eleven","d":["Peruvian-Japanese rooftop restaurant and bar on Sukhumvit 11 with a good kitchen and a lively scene. The closest rooftop to the hotel.","Nhà hàng và bar sân thượng Peru-Nhật trên Sukhumvit 11, đồ ăn ngon và không khí sôi động. Là sân thượng gần khách sạn nhất.","수쿰윗 11에 있는 페루-일식 루프탑 레스토랑 겸 바로, 음식이 좋고 분위기가 활기차요. 호텔에서 가장 가까운 루프탑이에요."],"km":2.8,"a":11,"b":16,"l":"https://maps.google.com/?q=Above+Eleven+Bangkok","lv":0,"g":"4.6","rc":"6,542","ig":"aboveelevenbkk"},{"n":"Char (Hotel Indigo)","d":["Rooftop at Hotel Indigo on Wireless Road. Hipper and less corporate than most, with good craft cocktails.","Sân thượng tại Hotel Indigo trên đường Wireless. Trẻ trung, ít khuôn mẫu hơn, cocktail thủ công ngon.","와이어리스 로드의 호텔 인디고 루프탑이에요. 다른 곳보다 힙하고 덜 격식 차린 분위기이며 크래프트 칵테일이 좋아요."],"km":4.3,"a":14,"b":22,"l":"https://maps.google.com/?q=Char+Rooftop+Hotel+Indigo+Bangkok","lv":1,"g":"4.6","rc":"926","ig":"charbangkok"},{"n":"WALK Rooftop","d":["Rooftop bar on the 20th floor of Centara Watergate Pavilion in Pratunam. Sophisticated yet affordable.","Bar sân thượng ở tầng 20 Centara Watergate Pavilion, khu Pratunam. Tinh tế nhưng giá hợp lý.","프라투남의 센타라 워터게이트 파빌리온 20층에 있는 루프탑 바예요. 세련됐지만 가격은 합리적이에요."],"km":3.9,"a":13,"b":21,"l":"https://maps.google.com/?q=WALK+Rooftop+Bar+Centara+Watergate+Pavilion","lv":0,"g":"4.3","rc":"167"},{"n":"Lamaya","d":["Jungle / tribal-themed sky bar on the 30th floor above Sukhumvit 24. Opened December 2024. Cocktails about 380-420 THB, with DJs and weekend fire shows.","Sky bar phong cách rừng/bộ lạc ở tầng 30 trên Sukhumvit 24. Khai trương tháng 12/2024. Cocktail khoảng 380-420 THB, có DJ và biểu diễn lửa cuối tuần.","수쿰윗 24 위 30층의 정글/부족 테마 스카이 바예요. 2024년 12월 오픈, 칵테일 약 380~420바트이고 DJ와 주말 파이어쇼가 있어요."],"km":5.4,"a":16,"b":27,"l":"https://maps.google.com/?q=Lamaya+Bangkok","lv":1,"g":"4.7","rc":"1,443","ig":"lamayabangkok"},{"n":"Tichuca","d":["Famous for its giant LED \"Avatar tree\" that changes color through the night (46th floor, T-One Building). Walk-in only, bring your passport, 17% service charge.","Nổi tiếng với \"cây Avatar\" LED khổng lồ đổi màu suốt đêm (tầng 46, tòa T-One). Chỉ nhận khách vãng lai, mang theo hộ chiếu, phụ thu phục vụ 17%.","밤새 색이 바뀌는 거대한 LED \"아바타 나무\"로 유명해요(T-One 빌딩 46층). 예약 없이 방문만 가능하고, 여권을 지참하세요. 봉사료 17%가 붙어요."],"km":6.2,"a":17,"b":30,"l":"https://maps.google.com/?q=Tichuca+Rooftop+Bar","lv":1,"g":"4.2","rc":"7,205","ig":"tichuca.bkk"},{"n":"Octave (Marriott)","d":["Three-level rooftop on floors 45-49 of Bangkok Marriott Sukhumvit (Thonglor), with 360-degree views. Cocktails about 350-450 THB; happy hour around 5-7pm.","Sân thượng 3 tầng ở tầng 45-49 Bangkok Marriott Sukhumvit (Thonglor), tầm nhìn 360 độ. Cocktail khoảng 350-450 THB; giờ vàng khoảng 17h-19h.","방콕 메리어트 수쿰윗(통로) 45~49층의 3층 구조 루프탑으로 360도 전망이에요. 칵테일 약 350~450바트, 해피아워는 17~19시쯤이에요."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Octave+Rooftop+Bangkok","lv":1,"g":"4.4","rc":"6,234","ig":"octave_rooftop"}]},{"c":"wine","t":["5. Wine bars / pubs","5. Quán rượu vang / pub","5. 와인바 / 펍"],"items":[{"n":"Chenin","d":["Intimate, candlelit natural wine bar and bistro on Sukhumvit 31, with 100+ labels. Good for a date. The closest of the wine bars.","Quán rượu vang tự nhiên và bistro ấm cúng, ánh nến, trên Sukhumvit 31, hơn 100 loại rượu. Hợp để hẹn hò. Gần nhất trong các quán rượu vang.","수쿰윗 31의 아늑한 촛불 분위기 내추럴 와인바 겸 비스트로로, 와인이 100종 이상이에요. 데이트에 좋고, 와인바 중 가장 가까워요."],"km":3.5,"a":12,"b":19,"l":"https://maps.google.com/?q=Chenin+Bangkok+Sukhumvit+31","lv":0,"g":"4.6","rc":"1,704","ig":"chenin.bkk"},{"n":"Vessel (EmSphere)","d":["Wine bar on the ground floor of EmSphere, right beside Phrom Phong BTS, with more than 200 wines by the glass.","Quán rượu vang ở tầng trệt EmSphere, ngay cạnh BTS Phrom Phong, hơn 200 loại rượu vang bán theo ly.","프롬퐁 BTS역 바로 옆 엠스피어 1층의 와인바로, 잔 와인이 200종 넘게 있어요."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=Vessel+Wine+Bar+EmSphere+Bangkok","lv":1,"g":"4.5","rc":"38","ig":"vesselwine"},{"n":"1010 Wine Bar & Restaurant","d":["Wine bar and restaurant on the 5th floor of EmSphere, with Italian-Mediterranean food and about 60 wines by the glass or bottle.","Quán rượu vang và nhà hàng ở tầng 5 EmSphere, món Ý-Địa Trung Hải, khoảng 60 loại rượu vang bán theo ly hoặc chai.","엠스피어 5층의 와인바 겸 레스토랑으로, 이탈리안-지중해 요리와 잔 또는 병으로 마실 수 있는 와인 약 60종이 있어요."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=1010+Wine+Bar+Emsphere+Bangkok","lv":1,"g":"4.7","rc":"89","ig":"1010bkk"},{"n":"Swirl (Thonglor)","d":["New wine bar at Civic Park, Thong Lo 13, picked by Time Out as one of Bangkok's top new wine bars. Open daily 2:30pm-11pm.","Quán rượu vang mới ở Civic Park, Thong Lo 13, được Time Out chọn là một trong những quán rượu vang mới hàng đầu Bangkok. Mở cửa 14h30-23h hằng ngày.","통로 13 시빅 파크의 새 와인바로, 타임아웃이 방콕 최고의 신규 와인바로 꼽았어요. 매일 14:30~23:00 영업이에요."],"km":4.4,"a":14,"b":23,"l":"https://maps.google.com/?q=Swirl+Thonglor+Bangkok","lv":1,"g":"4.7","rc":"197","ig":"swirl_bangkok"},{"n":"Piché Wine Bar","d":["Thailand's first wine-on-tap bar, at BLV24 on Sukhumvit 24. Opened May 2025, with DJs and a music-driven atmosphere.","Quán rượu vang rót từ vòi đầu tiên của Thái Lan, tại BLV24 trên Sukhumvit 24. Khai trương tháng 5/2025, có DJ và không khí âm nhạc sôi động.","수쿰윗 24 BLV24에 있는 태국 최초의 와인 생맥주식(탭) 바예요. 2025년 5월 오픈, DJ가 있는 음악 중심의 분위기예요."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=Piche+Wine+Bar+Bangkok","lv":1,"g":"4.9","rc":"248","ig":"piche.bkk"}]},{"c":"club","t":["6. Club lounges","6. Club / lounge","6. 클럽 / 라운지"],"items":[{"n":"Havana Social","d":["Hidden bar behind a phone booth, inspired by 1940s Cuba, on Sukhumvit Soi 11. Latin music from 10pm, smart casual (covered shoes for men), 20+ only. Open 6pm-2am.","Bar bí mật sau buồng điện thoại, lấy cảm hứng từ Cuba thập niên 1940, trên Sukhumvit Soi 11. Nhạc Latin từ 22h, ăn mặc lịch sự (nam đi giày kín), chỉ từ 20 tuổi. Mở cửa 18h-2h.","수쿰윗 소이 11에 있는 1940년대 쿠바 콘셉트의 전화부스 뒤 숨은 바예요. 22시부터 라틴 음악, 스마트 캐주얼(남성은 발등이 덮이는 신발), 20세 이상만 입장 가능해요. 18시~새벽 2시 영업이에요."],"km":2.9,"a":11,"b":16,"l":"https://maps.google.com/?q=Havana+Social+Bangkok","lv":0,"g":"4.4","rc":"2,613","ig":"havanasocialbkk"},{"n":"Upper House","d":["Club on the 2nd floor of 24 BLVD, Sukhumvit 24, near Phrom Phong. R&B and hip-hop early, house and EDM late. Table minimum about 10,000-25,000 THB.","Club ở tầng 2 tòa 24 BLVD, Sukhumvit 24, gần Phrom Phong. Đầu đêm R&B và hip-hop, về khuya house và EDM. Đặt bàn tối thiểu khoảng 10.000-25.000 THB.","프롬퐁 근처 수쿰윗 24의 24 BLVD 2층에 있는 클럽이에요. 초반엔 R&B와 힙합, 늦은 시간엔 하우스와 EDM이에요. 테이블 최소 주문 약 10,000~25,000바트예요."],"km":6,"a":17,"b":29,"l":"https://maps.app.goo.gl/iMwkYuAkp7StQyX66","lv":1,"g":"4.7","rc":"1,148","ig":"upperhousebangkok"},{"n":"Salone Di Vita","d":["Luxury hip-hop and R&B club on Sukhumvit 63 (Ekkamai) with baroque decor and international guest DJs. Open from 9pm; entry about 1,000 THB or more.","Club hip-hop và R&B sang trọng trên Sukhumvit 63 (Ekkamai), nội thất kiểu baroque, có DJ khách quốc tế. Mở cửa từ 21h; vé vào khoảng 1.000 THB trở lên.","수쿰윗 63(에까마이)의 고급 힙합/R&B 클럽으로 바로크풍 인테리어와 해외 게스트 DJ가 있어요. 21시부터 열고 입장료는 약 1,000바트 이상이에요."],"km":5.2,"a":15,"b":26,"l":"https://maps.app.goo.gl/YwF53TcwopQPaGsQA","lv":1,"g":"4.8","rc":"1,705","ig":"salonedivita"},{"n":"Dope & Dirty","d":["Hip-hop club on Sukhumvit 63 (Ekkamai 7) with graffiti and neon, popular with young locals. Reservation recommended, smart casual.","Club hip-hop trên Sukhumvit 63 (Ekkamai 7), tường graffiti và đèn neon, được giới trẻ địa phương yêu thích. Nên đặt trước, ăn mặc lịch sự.","수쿰윗 63(에까마이 7)의 힙합 클럽으로 그래피티와 네온이 있고 현지 젊은이들에게 인기예요. 예약을 권장하고 스마트 캐주얼이에요."],"km":5.2,"a":15,"b":26,"l":"https://maps.app.goo.gl/TwXEKjZy3HjfxBKt6","lv":1,"g":"4.4","rc":"1,253"},{"n":"House of Savoy","d":["Stylish bar-club on the 2nd floor of SILQ on Sukhumvit, open 24 hours. About ฿2,000+ per person. Shown in Anthony Gray's Bangkok club tier-list reel.","Bar-club sang trọng ở tầng 2 SILQ trên đường Sukhumvit, mở cửa 24 giờ. Khoảng ฿2,000+ mỗi người. Có trong video xếp hạng club Bangkok của Anthony Gray.","수쿰윗 SILQ 2층의 세련된 바 겸 클럽으로 24시간 영업해요. 1인 약 2,000바트 이상이에요. 앤서니 그레이의 방콕 클럽 티어리스트 릴스에 나왔어요."],"km":5.3,"a":16,"b":27,"l":"https://maps.google.com/?q=House+of+Savoy+Bangkok","lv":1,"g":"4.9","rc":"1,115","ig":"houseofsavoybangkok"},{"n":"MIRA Club Bangkok","d":["Nightclub in Sukhumvit Soi 11 (about ฿2,000+ per person). A reviewer said that on arrival around 10pm you may need to order a drink at a table to get in.","Hộp đêm ở Sukhumvit Soi 11 (khoảng ฿2,000+ mỗi người). Một người đánh giá cho biết khi đến khoảng 22h có thể phải gọi đồ uống tại bàn mới được vào.","수쿰윗 소이 11의 나이트클럽이에요(1인 약 2,000바트 이상). 한 후기에 따르면 밤 10시쯤 도착하면 테이블에서 술을 주문해야 입장할 수 있을 수 있어요."],"km":3.2,"a":11,"b":19,"l":"https://maps.google.com/?q=MIRA+Club+Bangkok","lv":0,"g":"4.7","rc":"839","ig":"miraclub.bkk"},{"n":"MUIN Bangkok Club","d":["Nightclub on the 5th floor above Donki Mall, Sukhumvit Soi 63 (Ekkamai). Opens at 9pm.","Hộp đêm tầng 5 phía trên Donki Mall, Sukhumvit Soi 63 (Ekkamai). Mở cửa lúc 21h.","수쿰윗 소이 63(에까마이) 동키몰 위 5층의 나이트클럽이에요. 21시에 문을 열어요."],"km":5.3,"a":16,"b":27,"l":"https://maps.google.com/?q=MUIN+Bangkok+Club","lv":1,"g":"4.6","rc":"1,605","ig":"muin_bangkok"},{"n":"Baccarat Bangkok","d":["Bar-club in Sukhumvit Soi 24 (Davis Bangkok area). Marked LGBTQ+ friendly on Google Maps. Opening hours not listed.","Bar-club ở Sukhumvit Soi 24 (khu Davis Bangkok). Google Maps ghi là thân thiện với LGBTQ+. Chưa có giờ mở cửa.","수쿰윗 소이 24(데이비스 방콕 근처)의 바 겸 클럽이에요. 구글 지도에 LGBTQ+ 친화로 표시돼 있고, 영업시간은 나와 있지 않아요."],"km":6,"a":17,"b":29,"l":"https://maps.google.com/?q=BACCARAT+Bangkok+Sukhumvit+24","lv":1,"g":"4.4","rc":"1,915","ig":"baccaratbangkok"}]},{"c":"night","t":["7. Night markets","7. Chợ đêm","7. 야시장"],"items":[{"n":"Jodd Fairs Ratchada","d":["Trendy night market known for street food, neon tents and cheap clothes. The old Rama 9 branch near the hotel is closed, so go to this Ratchada site next to Big C (MRT Thailand Cultural Centre). Open daily from about 5pm to 1am; better after 6pm.","Chợ đêm thịnh hành với đồ ăn đường phố, lều neon và quần áo giá rẻ. Chi nhánh Rama 9 gần khách sạn đã đóng cửa, nên hãy đến địa điểm Ratchada cạnh Big C (MRT Thailand Cultural Centre). Mở cửa hằng ngày khoảng 17h-1h; nên đi sau 18h.","길거리 음식, 네온 천막, 저렴한 옷으로 유명한 트렌디한 야시장이에요. 호텔 근처 옛 라마 9 지점은 폐업해서, 빅C 옆(MRT 타일랜드 컬처럴 센터) 라차다 지점으로 가야 해요. 매일 약 17시~새벽 1시 영업, 18시 이후가 더 좋아요."],"km":2.2,"a":9,"b":14,"l":"https://maps.google.com/?q=Jodd+Fairs+Ratchada+Bangkok","lv":0,"ig":"joddfairs_ratchada"},{"n":"Train Night Market Ratchada","d":["The famous Talad Rot Fai, reopened in March 2026 behind Esplanade Ratchadaphisek. Vintage shops, container bars, live music and street food. Listings say daily or Thursday to Sunday, 5pm-1am, so check before going. Best after 7pm.","Chợ Talad Rot Fai nổi tiếng, mở lại tháng 3/2026 phía sau Esplanade Ratchadaphisek. Có đồ vintage, quán bar container, nhạc sống và đồ ăn đường phố. Nguồn ghi mở hằng ngày hoặc thứ 5 đến Chủ nhật, 17h-1h, nên kiểm tra trước khi đi. Đẹp nhất sau 19h.","유명한 딸랏 롯파이로, 2026년 3월 에스플러네이드 라차다피섹 뒤편에 재오픈했어요. 빈티지 가게, 컨테이너 바, 라이브 음악, 길거리 음식이 있어요. 매일 또는 목~일 17시~새벽 1시라는 정보가 엇갈리니 가기 전에 확인하세요. 19시 이후가 가장 좋아요."],"km":2.5,"a":10,"b":16,"l":"https://maps.google.com/?q=Train+Night+Market+Ratchada+Bangkok","lv":0,"ig":"trainnightmarket_ratchada"},{"n":"Train Night Market Srinakarin","d":["The original retro Talad Rot Fai with antiques, vintage items and food. Open Thursday to Sunday only, 5pm-midnight or 1am (MRT Yellow Line, Suan Luang Rama IX). Farther out.","Chợ Talad Rot Fai gốc phong cách retro với đồ cổ, đồ vintage và ẩm thực. Chỉ mở thứ 5 đến Chủ nhật, 17h-0h hoặc 1h (MRT Yellow Line, Suan Luang Rama IX). Khá xa.","안티크, 빈티지 소품, 음식이 있는 오리지널 레트로 딸랏 롯파이예요. 목~일만 열고 17시~자정 또는 1시까지예요(MRT 옐로라인, Suan Luang Rama IX역). 조금 멀어요."],"km":9,"a":23,"b":41,"l":"https://maps.google.com/?q=Train+Night+Market+Srinakarin+Bangkok","lv":2,"ig":"trainnightmarket_srinakarin"},{"n":"Chatuchak Weekend Market","d":["Bangkok's biggest market with thousands of stalls (clothes, crafts, food, plants). It is a daytime weekend market, Saturday and Sunday about 9am-6pm, plus a Friday evening session. Sunday Nov 1 is the only weekend day of this trip. Bring cash; expect heat and crowds.","Chợ lớn nhất Bangkok với hàng nghìn gian hàng (quần áo, đồ thủ công, ăn uống, cây cảnh). Đây là chợ ban ngày cuối tuần, thứ 7 và Chủ nhật khoảng 9h-18h, thêm phiên tối thứ 6. Chủ nhật 1/11 là ngày cuối tuần duy nhất của chuyến đi. Mang tiền mặt; trời nóng và đông người.","수천 개의 노점(옷, 공예품, 음식, 식물)이 있는 방콕 최대 시장이에요. 낮에 여는 주말 시장으로 토·일 약 9시~18시, 금요일 저녁 장도 서요. 이번 여행에서는 11월 1일(일)만 주말에 해당해요. 현금을 챙기고 더위와 인파를 각오하세요."],"km":6.3,"a":18,"b":30,"l":"https://maps.google.com/?q=Chatuchak+Weekend+Market+Bangkok","lv":1,"ig":"chatuchakweekendmarket"},{"n":"Khao San Road","d":["Famous backpacker street that comes alive at night, with street food, bars, live music and cheap souvenirs. Busiest after 8pm and open late.","Con phố nổi tiếng của dân du lịch bụi, sôi động về đêm với đồ ăn đường phố, bar, nhạc sống và quà lưu niệm giá rẻ. Đông nhất sau 20h và mở đến khuya.","밤에 활기가 넘치는 유명한 배낭여행자 거리로, 길거리 음식, 바, 라이브 음악, 저렴한 기념품이 있어요. 20시 이후가 가장 붐비고 늦게까지 열어요."],"km":10.1,"a":25,"b":43,"l":"https://maps.google.com/?q=Khao+San+Road+Bangkok","lv":2}]},{"c":"mookata","t":["8. Mookata","8. Mookata","8. 무카타"],"items":[{"n":"71 Mu Kratha","d":["Air-conditioned charcoal-grill mookata (Thai pork grill and hotpot), saved in your Google Maps list. Rated 4.5 from 902 reviews. It is in the far north-east of the city, so allow a long ride.","Mookata (nướng và lẩu heo kiểu Thái) bằng than, có máy lạnh, đã lưu trong danh sách Google Maps của bạn. Đánh giá 4,5 từ 902 lượt. Nằm ở phía đông bắc xa thành phố nên đi khá lâu.","에어컨이 있는 숯불 무카타(태국식 돼지고기 구이 겸 전골)로, 구글 지도 저장 목록에 있는 곳이에요. 리뷰 902개에 평점 4.5예요. 도시 북동쪽 끝이라 이동 시간이 길어요."],"km":12.8,"a":31,"b":53,"l":"https://maps.google.com/?q=71+Mu+Kratha+Bangkok","lv":2,"g":"4.5","rc":"902","ig":"71mookata"},{"n":"The Cafe Mookata Ari","d":["Mookata in Ari, saved in your list. About 200-400 THB per person; opens at 4pm.","Mookata ở khu Ari, đã lưu trong danh sách của bạn. Khoảng 200-400 THB mỗi người; mở cửa từ 16h.","아리에 있는 무카타로 저장 목록에 있는 곳이에요. 1인 약 200~400바트, 16시에 열어요."],"km":4.6,"a":14,"b":24,"l":"https://maps.google.com/?q=The+Cafe+Mookata+Ari","lv":1,"g":"4.5","rc":"245","ig":"thecafemookata.ari"},{"n":"Khun Ple Mookata","d":["Mookata in Huai Khwang with outdoor seating, about 200-400 THB per person. Open late (until about 12:30am).","Mookata ở Huai Khwang có chỗ ngồi ngoài trời, khoảng 200-400 THB mỗi người. Mở đến khuya (khoảng 0h30).","후아이쾅에 있는 야외석 무카타로 1인 약 200~400바트예요. 밤 12시 30분쯤까지 늦게 열어요."],"km":3.8,"a":13,"b":21,"l":"https://maps.google.com/?q=Khun+Ple+Mookata+Bangkok","lv":0,"g":"4.3","rc":"1,290","ig":"mhookratakhunple"},{"n":"Khun Phat Mookata (Huai Khwang)","d":["Highly rated mookata in Huai Khwang, about 200-400 THB per person. Opens around 3:30pm. Menu is in Thai, so have the order ready on your phone.","Mookata được đánh giá rất cao ở Huai Khwang, khoảng 200-400 THB mỗi người. Mở cửa khoảng 15h30. Thực đơn tiếng Thái nên hãy chuẩn bị sẵn món trên điện thoại.","후아이쾅에 있는 평점 높은 무카타로 1인 약 200~400바트예요. 15시 30분쯤 열어요. 메뉴가 태국어라서 주문할 메뉴를 휴대폰에 준비해 가세요."],"km":4.1,"a":13,"b":22,"l":"https://maps.google.com/?q=Khun+Phat+Mookata+Huai+Khwang","lv":1,"g":"4.9","rc":"1,188"},{"n":"Saneh Mookrata","d":["Mookata on Sukhumvit 22, about 400-600 THB per person. Opens at 4pm and takes reservations.","Mookata trên Sukhumvit 22, khoảng 400-600 THB mỗi người. Mở cửa từ 16h và nhận đặt chỗ.","수쿰윗 22의 무카타로 1인 약 400~600바트예요. 16시에 열고 예약이 가능해요."],"km":4.9,"a":15,"b":25,"l":"https://maps.google.com/?q=Saneh+Mookrata+Sukhumvit+22","lv":1,"g":"4.8","rc":"504","ig":"saneh_mookrata"},{"n":"Jing Jai Mookata (Ratchada)","d":["Air-conditioned mookata in Huai Khwang, about 200-400 THB per person. Open late, until about 2am. Close to the hotel.","Mookata có máy lạnh ở Huai Khwang, khoảng 200-400 THB mỗi người. Mở đến khuya, khoảng 2h sáng. Gần khách sạn.","후아이쾅의 에어컨 무카타로 1인 약 200~400바트예요. 새벽 2시쯤까지 늦게 열고 호텔에서 가까워요."],"km":3.2,"a":11,"b":19,"l":"https://maps.google.com/?q=Jing+Jai+Mookata+Ratchada+Bangkok","lv":0,"g":"4.2","rc":"236","ig":"jingjaimookrata"},{"n":"Chin Bo Dang (EmQuartier)","d":["Air-conditioned, modern mookata restaurant on the Helix dining floors of EmQuartier at Phrom Phong BTS. Comfortable and clean, a good choice if you do not want to sweat over the grill. Open until about 10pm.","Nhà hàng mookata hiện đại có máy lạnh ở tầng ẩm thực Helix của EmQuartier, cạnh BTS Phrom Phong. Sạch sẽ, thoải mái, hợp nếu không muốn ra mồ hôi bên bếp nướng. Mở đến khoảng 22h.","프롬퐁 BTS역 엠쿼티어(EmQuartier) 헬릭스 식당층에 있는 에어컨 나오는 모던한 무카타 식당이에요. 쾌적하고 깨끗해서 불 앞에서 땀 흘리기 싫을 때 좋아요. 22시쯤까지 영업해요."],"km":4.5,"a":14,"b":24,"l":"https://maps.google.com/?q=Chin+Bo+Dang+EmQuartier+Bangkok","lv":1,"ig":"chinbodang"}]},{"c":"walk","t":["9. Walks near home","9. Đi bộ gần nhà","9. 집 근처 산책"],"items":[{"n":"Great Buddha Monastery","d":["Buddhist temple right next to the condo, a short and quiet walk. Open until about 9pm.","Ngôi chùa Phật giáo ngay cạnh căn hộ, đi bộ ngắn và yên tĩnh. Mở cửa đến khoảng 21h.","콘도 바로 옆의 절로, 짧고 조용하게 산책하기 좋아요. 약 21시까지 열어요."],"km":0.4,"a":0,"b":0,"w":[0.4,5],"l":"https://maps.google.com/?q=Great+Buddha+Monastery+Bangkok","lv":0,"g":"4.3","rc":"107"},{"n":"MRTA Health Park","d":["Small, well-kept park inside the MRTA office compound with a running track, a pond with turtles and shady trees. Hours are about 5am-7:30pm, so go in the morning or late afternoon.","Công viên nhỏ, được chăm sóc tốt, nằm trong khuôn viên văn phòng MRTA, có đường chạy bộ, ao có rùa và nhiều bóng cây. Mở cửa khoảng 5h-19h30, nên đi buổi sáng hoặc chiều muộn.","MRTA(지하철공사) 사무실 부지 안의 작고 관리가 잘 된 공원으로, 러닝 트랙, 거북이가 있는 연못, 그늘진 나무가 있어요. 운영시간은 약 05:00~19:30이라 아침이나 늦은 오후에 가세요."],"km":0.7,"a":0,"b":0,"w":[0.7,8],"l":"https://maps.google.com/?q=MRTA+Health+Park+Bangkok","lv":0,"g":"4.4","rc":"191"},{"n":"Wat Uthai Tharam","d":["Temple complex with a golden stupa on Kamphaeng Phet 7 Road. Easy walk, good for photos.","Quần thể chùa có bảo tháp vàng trên đường Kamphaeng Phet 7. Đi bộ dễ dàng, chụp ảnh đẹp.","캄팽펫 7길에 있는 황금 탑이 있는 사원이에요. 걷기 쉽고 사진 찍기 좋아요."],"km":0.9,"a":0,"b":0,"w":[0.9,11],"l":"https://maps.google.com/?q=Wat+Uthai+Tharam+Bangkok","lv":0,"g":"4.5","rc":"695"},{"n":"Wake Me Up Café & Bistro","d":["Quiet neighborhood cafe and bistro on Phetchaburi Soi 47, open until midnight. Drinks under about 200 THB.","Quán cà phê và bistro yên tĩnh trong khu dân cư ở Phetchaburi Soi 47, mở đến nửa đêm. Đồ uống dưới khoảng 200 THB.","페차부리 소이 47의 조용한 동네 카페 겸 비스트로로, 자정까지 열어요. 음료는 약 200바트 이하예요."],"km":1,"a":0,"b":0,"w":[1,12],"l":"https://maps.google.com/?q=Wake+Me+Up+Cafe+Bistro+Bangkok","lv":0,"g":"4.8","rc":"108"},{"n":"Central Rama 9","d":["Big air-conditioned mall with many restaurants and cafes, open until 10pm. BEANS Coffee Roaster is inside. Good on hot or rainy days.","Trung tâm thương mại lớn có máy lạnh với nhiều nhà hàng và quán cà phê, mở đến 22h. Có BEANS Coffee Roaster bên trong. Phù hợp ngày nóng hoặc mưa.","에어컨이 나오는 대형 쇼핑몰로 식당과 카페가 많고 22시까지 열어요. 안에 BEANS Coffee Roaster가 있어요. 덥거나 비 오는 날 좋아요."],"km":1,"a":0,"b":0,"w":[1,12],"l":"https://maps.google.com/?q=Central+Rama+9+Bangkok","lv":0,"g":"4.5","rc":"31,437"},{"n":"Thailand Cultural Centre","d":["Performance and arts venue next to the MRT. A Khon (masked dance) production of 'Sita' is listed from Nov 5 to Dec 10 (not checked with the box office), so check the schedule first.","Địa điểm biểu diễn và nghệ thuật cạnh MRT. Vở Khon (múa mặt nạ) 'Sita' được liệt kê từ 5/11 đến 10/12 (chưa kiểm tra với phòng vé), nên xem lịch trước.","MRT 옆의 공연장 겸 문화센터예요. 콘(가면 무용극) 'Sita' 공연이 11월 5일~12월 10일로 올라와 있어요(매표소 확인은 못 했어요). 먼저 일정을 확인하세요."],"km":1.6,"a":0,"b":0,"w":[1.6,19],"l":"https://maps.google.com/?q=Thailand+Cultural+Centre+Bangkok","lv":1,"g":"4.5","rc":"5,393"},{"n":"Esplanade Ratchadaphisek","d":["Mall with restaurants and a cinema, right on Ratchadaphisek Road next to the night markets.","Trung tâm thương mại có nhà hàng và rạp chiếu phim, nằm ngay trên đường Ratchadaphisek cạnh các chợ đêm.","식당과 영화관이 있는 쇼핑몰로, 라차다피섹 도로에 있고 야시장과 가까워요."],"km":1.6,"a":0,"b":0,"w":[1.6,19],"l":"https://maps.google.com/?q=Esplanade+Ratchadaphisek+Bangkok","lv":1,"g":"4.3","rc":"2,233"},{"n":"Siam Niramit","d":["Large stage show about Thai culture and history. Worth going only if you book a show; check show times first.","Chương trình biểu diễn lớn về văn hóa và lịch sử Thái. Chỉ nên đi nếu đặt vé xem; hãy kiểm tra giờ diễn trước.","태국 문화와 역사를 다룬 대형 무대 공연이에요. 공연을 예약해서 볼 때만 갈 만하고, 공연 시간은 먼저 확인하세요."],"km":2,"a":0,"b":0,"w":[2,24],"l":"https://maps.google.com/?q=Siam+Niramit+Bangkok","lv":1,"g":"4.5","rc":"6,212"},{"n":"Huai Khwang Market","d":["Local market and street-food area on Pracha Songkhro Road, with many Chinese restaurants nearby (often called the new Chinatown). Open 24 hours; lively in the evening.","Chợ địa phương và khu ẩm thực đường phố trên đường Pracha Songkhro, gần đó có nhiều nhà hàng Trung Hoa (thường gọi là Chinatown mới). Mở 24 giờ; nhộn nhịp buổi tối.","프라차 송크로 도로의 현지 시장 겸 길거리 음식 지역으로, 근처에 중식당이 많아요(새로운 차이나타운이라 불러요). 24시간 열고 저녁에 활기차요."],"km":3.2,"a":0,"b":0,"w":[3.2,38],"l":"https://maps.google.com/?q=Huai+Khwang+Market+Bangkok","lv":2,"g":"4.2","rc":"5,308"},{"n":"Wat Phra Ram 9 Kanchanaphisek","d":["Big, minimalist modern temple with Buddhist sculptures, a white chapel and a peaceful pond ringed by trees. Open about 6am-7pm.","Ngôi chùa hiện đại tối giản rộng lớn với các tượng Phật, nhà nguyện trắng và ao yên bình có cây bao quanh. Mở cửa khoảng 6h-19h.","불상 조각, 하얀 예배당, 나무로 둘러싸인 고요한 연못이 있는 크고 미니멀한 현대식 사원이에요. 약 06:00~19:00 열어요."],"km":3.2,"a":0,"b":0,"w":[3.2,38],"l":"https://maps.google.com/?q=Wat+Phra+Ram+9+Kanchanaphisek+Bangkok","lv":2,"g":"4.6","rc":"1,834"},{"n":"Ganesha Temple (Ratchadaphisek)","d":["Popular Hindu Ganesha shrine, open 24 hours. Often lit and lively in the evening.","Đền thờ thần Ganesha nổi tiếng, mở cửa 24 giờ. Buổi tối thường sáng đèn và nhộn nhịp.","인기 있는 힌두교 가네샤 사당으로 24시간 열어요. 저녁에 불이 켜져 있고 활기찬 경우가 많아요."],"km":3.3,"a":0,"b":0,"w":[3.3,40],"l":"https://maps.google.com/?q=Ganesha+temple+Ratchadaphisek+Bangkok","lv":2,"g":"4.7","rc":"2,365"},{"n":"Oasis Coffee Huai Khwang","d":["Cafe open 24 hours on Pracha Rat Bamphen Road, often full of young people studying or chatting. A good rest stop after the market. Under about 200 THB per person.","Quán cà phê mở 24 giờ trên đường Pracha Rat Bamphen, thường đông người trẻ học bài hoặc trò chuyện. Điểm nghỉ chân tốt sau khi đi chợ. Dưới khoảng 200 THB mỗi người.","프라차랏 밤펜 도로에 있는 24시간 카페로, 공부하거나 수다 떠는 젊은 사람들이 많아요. 시장 구경 후 쉬어 가기 좋고 1인 약 200바트 이하예요."],"km":3.3,"a":0,"b":0,"w":[3.3,40],"l":"https://maps.google.com/?q=Oasis+Coffee+Huai+Khwang+Bangkok","lv":2,"g":"4.4","rc":"493"},{"n":"Benjakitti Park","d":["Large lakeside park with a long walking and cycling path and a view of the skyline. Far for a walk (about 4 km), so consider a taxi or MRT one way.","Công viên lớn ven hồ với đường đi bộ và đạp xe dài, nhìn thấy đường chân trời thành phố. Khá xa để đi bộ (khoảng 4 km), nên đi taxi hoặc MRT một chiều.","호수를 낀 큰 공원으로 긴 산책·자전거 길이 있고 도시 스카이라인이 보여요. 걷기엔 멀어서(약 4km) 한쪽은 택시나 MRT를 추천해요."],"km":4.3,"a":0,"b":0,"w":[4.3,52],"l":"https://maps.google.com/?q=Benjakitti+Park+Bangkok","lv":2,"g":"4.6","rc":"11,350"}]},{"c":"tix","t":["10. Tickets & events","10. Vé & sự kiện","10. 티켓 · 행사 정보"],"items":[{"n":"Thai Ticket Major (tickets)","d":["Thailand's main ticket site for concerts, shows and sports. English version available. Official seller for Khon Sita, BOYdKO and BIG ASS.","Trang bán vé chính của Thái Lan cho concert, show và thể thao. Có bản tiếng Anh. Bán vé chính thức cho Khon Sita, BOYdKO và BIG ASS.","태국 최대 티켓 사이트로 콘서트, 공연, 스포츠를 팔아요. 영어 버전이 있고, Khon Sita, BOYdKO, BIG ASS의 공식 예매처예요."],"l":"https://www.thaiticketmajor.com/concert/?lang=en","x":1},{"n":"AsiaLive365 (concert schedule)","d":["Monthly list of Bangkok concerts with prices and links to the official sellers.","Danh sách concert Bangkok theo tháng, có giá vé và liên kết đến nơi bán chính thức.","방콕 콘서트를 월별로 정리해 가격과 공식 예매처 링크를 보여줘요."],"l":"https://asialive365.com/concerts/bangkok","x":1},{"n":"Thailand What's On (all events)","d":["Monthly list of events in Thailand, including culture and stage shows.","Danh sách sự kiện hằng tháng ở Thái Lan, gồm văn hóa và biểu diễn sân khấu.","태국 행사를 월별로 정리했고 문화, 무대 공연도 나와요."],"l":"https://thailandwhatson.com/months/2026-11","x":1}]}];
